services:
  - type: web
    name: leadflow-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false   # Set in Render Dashboard
      - key: JWT_SECRET
        sync: false   # Set in Render Dashboard
      - key: JWT_EXPIRES_IN
        value: 60m
      - key: CLIENT_URL
        sync: false   # Set to your Vercel frontend URL
